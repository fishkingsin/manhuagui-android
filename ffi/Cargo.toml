[package]
name = "manhuagui-ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "manhuagui_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
uniffi = { version = "=0.28.3", features = ["tokio"] }

[features]
uniffi-bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-bindgen"]
